# Runs the checks on every push and pull request, on Linux, macOS and Windows.
# The quick set needs no scanners: tools that are missing show as UNTESTED, which is fine. What it proves
# is that the scripts themselves run on each system (macOS ships bash 3.2, Windows uses Git Bash).
# Actions are pinned to exact commits (the audit's own rule); the version is in the comment.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint (syntax, Ruff, ShellCheck, page script)
        run: bash tests/lint.sh

  quick:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Quick tests
        run: bash tests/run-tests.sh --fast

  full:
    # The complete set with the Python scanners installed. Run it by hand (Actions tab > tests > Run workflow).
    if: github.event_name == 'workflow_dispatch'
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install scanners
        run: python -m pip install semgrep ruff lizard zizmor pip-audit
      - name: All tests
        run: bash tests/run-tests.sh
